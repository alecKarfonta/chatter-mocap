# this [2026-10-11] | INFO | release | One workflow, three OS targets; every v* tag publishes installable binaries
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow pytest

      - name: Run tests
        run: python -m pytest test/ -q

      - name: Generate icons
        run: python scripts/make_icon.py

      - name: Build binary
        run: pyinstaller chatter-mocap.spec --noconfirm --distpath dist --workpath build/pyi

      - name: Package macOS .app bundle
        if: runner.os == 'macOS'
        run: |
          # this [2026-10-11] | INFO | release.macApp | iconutil turns the PNG set into a real icns
          python - <<'EOF'
          from pathlib import Path
          import subprocess
          from PIL import Image
          build = Path('build')
          iconset = build / 'icon.iconset'
          iconset.mkdir(parents=True, exist_ok=True)
          master = Image.open(build / 'icon_1024.png')
          for size in (16, 32, 128, 256, 512):
              master.resize((size, size), Image.LANCZOS).save(iconset / f'icon_{size}x{size}.png')
              master.resize((size * 2, size * 2), Image.LANCZOS).save(iconset / f'icon_{size}x{size}@2x.png')
          subprocess.run(['iconutil', '-c', 'icns', str(iconset), '-o', str(build / 'icon.icns')], check=True)
          EOF
          APP="dist/Chatter Mocap.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp dist/chatter-mocap "$APP/Contents/MacOS/ChatterMocap"
          cp build/icon.icns "$APP/Contents/Resources/AppIcon.icns"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Chatter Mocap</string>
            <key>CFBundleDisplayName</key><string>Chatter Mocap</string>
            <key>CFBundleIdentifier</key><string>dev.karfonta.chatter-mocap</string>
            <key>CFBundleShortVersionString</key><string>${{ github.ref_name }}</string>
            <key>CFBundleExecutable</key><string>ChatterMocap</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
          </dict>
          </plist>
          PLIST
          # this [2026-10-11] | INFO | release.macSign | Ad-hoc signature: standard Gatekeeper flow for unsigned local builds
          codesign --force --sign - "$APP"
          cd dist && zip -r -y chatter-mocap-macos-app.zip "Chatter Mocap.app" && cd ..
          rm -rf "$APP"

      - name: Stage release files
        shell: bash
        run: |
          mkdir -p release
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp dist/chatter-mocap release/chatter-mocap-linux
          fi
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp dist/chatter-mocap release/chatter-mocap-macos
            cp dist/chatter-mocap-macos-app.zip release/ 2>/dev/null || true
          fi
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/chatter-mocap.exe release/chatter-mocap-windows.exe
          fi
          ls -la release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatter-mocap-${{ runner.os }}
          path: release/*

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
